services:
  db:
    image: postgres:16-alpine
    container_name: sen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sen_db
      POSTGRES_USER: sen_user
      POSTGRES_PASSWORD: change_this_password
    ports:
      - "5432:5432"
    volumes:
      - sen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sen_user -d sen_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sen_pgdata:
